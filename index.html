    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(160deg, #0a0618 0%, #1a103c 40%, #0f1b3d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow-x: hidden;
            padding: 24px 16px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(0, 136, 204, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 70% 80%, rgba(255, 65, 108, 0.12) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            text-align: center;
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.9s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: white;
            font-size: 13px;
            font-weight: 700;
            padding: 7px 18px;
            border-radius: 50px;
            margin-bottom: 28px;
            letter-spacing: 0.8px;
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.45);
            animation: pulse 2.2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 6px 20px rgba(255, 65, 108, 0.45); }
            50% { transform: scale(1.05); box-shadow: 0 8px 28px rgba(255, 65, 108, 0.6); }
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 14px;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 50%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 15px;
            color: #c7d2fe;
            margin-bottom: 32px;
            opacity: 0.9;
            letter-spacing: 0.3px;
        }

        .arrows {
            font-size: 34px;
            margin: 16px 0;
            animation: bounce 1.6s infinite;
            letter-spacing: 10px;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-14px); }
            60% { transform: translateY(-7px); }
        }

        .join-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #0088cc, #00b4ff);
            color: #fff;
            font-size: 19px;
            font-weight: 800;
            text-decoration: none;
            padding: 18px 34px;
            border-radius: 60px;
            box-shadow: 0 10px 30px rgba(0, 136, 204, 0.55),
                        0 0 0 1px rgba(255,255,255,0.1) inset;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin: 8px 0 12px;
            letter-spacing: 0.4px;
            position: relative;
            overflow: hidden;
        }

        .join-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .join-btn:hover::before {
            left: 100%;
        }

        .join-btn:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 14px 40px rgba(0, 136, 204, 0.7);
        }

        .join-btn:active {
            transform: scale(0.97);
        }

        .tg-logo {
            width: 30px;
            height: 30px;
            flex-shrink: 0;
        }

        .features {
            margin-top: 36px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feature {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 22px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 600;
            color: #e0e7ff;
            text-decoration: none;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .feature:hover {
            background: rgba(0, 136, 204, 0.15);
            border-color: rgba(0, 136, 204, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.25);
            color: #fff;
        }

        .feature:active {
            transform: scale(0.98);
        }

        .bottom-text {
            margin-top: 32px;
            font-size: 14px;
            color: #a5b4fc;
            opacity: 0.85;
            letter-spacing: 0.3px;
        }

        @media (max-width: 400px) {
            h1 {
                font-size: 26px;
            }
            .join-btn {
                font-size: 17px;
                padding: 16px 26px;
            }
            .tg-logo {
                width: 26px;
                height: 26px;
            }
            .feature {
                font-size: 15px;
                padding: 14px 18px;
            }
        }
    </style>
